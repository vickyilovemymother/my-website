<div class="configurator-container">
    
    <aside class="panel left-panel">
        <div class="gender-toggle">
            <button onclick="setGender('Men')" id="btn-men" class="active">MEN</button>
            <button onclick="setGender('Women')" id="btn-women">WOMEN</button>
        </div>

        <div class="category-tabs">
            <button onclick="showCategory('Top')">Tops</button>
            <button onclick="showCategory('Bottom')">Bottoms</button>
            <button onclick="showCategory('Jacket')">Jackets</button>
            <button onclick="showCategory('Comboset')" class="special-btn">Dress Mode</button>
        </div>

        <div id="thumbnail-grid" class="scroll-grid">
            </div>
        
        <div class="mannequin-control">
            <label>Mannequin</label>
            <input type="checkbox" id="mannequin-toggle" checked onchange="toggleMannequin(this.checked)">
        </div>
    </aside>

    <main id="threejs-canvas-container">
        <div id="loading-bar"></div>
    </main>

    <aside class="panel right-panel">
        <h3>Fabric Colors</h3>
        
        <div class="color-section">
            <span>Top</span>
            <input type="color" id="color-top" oninput="updateColor('top', this.value)">
        </div>
        <div class="color-section">
            <span>Bottom</span>
            <input type="color" id="color-bottom" oninput="updateColor('bottom', this.value)">
        </div>
        <div class="color-section">
            <span>Jacket</span>
            <input type="color" id="color-jacket" oninput="updateColor('jacket', this.value)">
        </div>
    </aside>
</div>
