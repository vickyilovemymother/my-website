<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VP Configurator Engine</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050505;
  --accent:#00f2ea;
  --panel:rgba(15,15,15,0.9);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  font-family:'Inter',sans-serif;
  color:#fff;
  overflow:hidden;
}

.top-bar{
  position:absolute;
  top:0;left:0;width:100%;height:70px;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 40px;
  background:rgba(0,0,0,0.7);
  border-bottom:1px solid rgba(255,255,255,0.1);
  z-index:20;
}

.panel{
  position:absolute;
  top:70px;width:260px;height:calc(100% - 70px);
  background:var(--panel);
  padding:20px;overflow:auto;
}

.left-panel{left:0;border-right:1px solid rgba(255,255,255,0.1);}
.right-panel{right:0;border-left:1px solid rgba(255,255,255,0.1);}

.panel h4{margin:20px 0 10px;font-family:'Space Grotesk';}

.panel button,
.panel select,
.panel input{
  width:100%;
  margin-bottom:10px;
  padding:8px;
  border-radius:6px;
  border:1px solid rgba(255,255,255,0.2);
  background:transparent;
  color:#aaa;
  font-size:12px;
}

.panel button:hover{
  border-color:var(--accent);
  color:var(--accent);
}

#vp-canvas{
  position:absolute;
  top:70px;left:260px;right:260px;bottom:0;
}

#exportPreview{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
}
#exportPreview canvas{
  border:2px solid var(--accent);
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/examples/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div class="top-bar">
  <div>VP Configurator Engine</div>
  <div style="color:var(--accent)">READY</div>
</div>

<div class="panel left-panel">
  <h4>Mode</h4>
  <button onclick="setMode('mix')">Mix & Match</button>

  <h4>Performance</h4>
  <button onclick="togglePerformance()">Performance Mode</button>

  <h4>Spin</h4>
  <button onclick="toggleSpin()">Auto Spin</button>

  <h4>Preset</h4>
  <button onclick="savePreset()">Save Outfit</button>
  <button onclick="loadPreset()">Load Outfit</button>
</div>

<div class="panel right-panel">

  <h4>Garment Color</h4>
  <input type="color" onchange="changeColor('top', this.value)">
  <input type="color" onchange="changeColor('bottom', this.value)">

  <h4>Background</h4>
  <input type="color" id="bgColorPicker" value="#000000">

  <h4>HDR Intensity (1-10)</h4>
  <input type="range" id="hdrIntensity" min="1" max="10" step="1" value="5">

  <h4>HDR Visibility</h4>
  <button onclick="toggleHDR()">Toggle HDR</button>

  <h4>Shadow</h4>
  <button onclick="toggleShadow()">Toggle Shadow</button>

  <h4>Export</h4>
  <input type="number" id="exportWidth" placeholder="Width (e.g 2048)">
  <input type="number" id="exportHeight" placeholder="Height (e.g 2048)">
  <button onclick="exportPNG(false)">Export PNG</button>
  <button onclick="exportPNG(true)">Transparent PNG</button>
  <button onclick="exportGIF()">Export Turntable GIF</button>

</div>

<div id="vp-canvas"></div>
<div id="exportPreview"></div>

<script type="module" src="./vp-configurator/main.js"></script>
</body>
</html>
